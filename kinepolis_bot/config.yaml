name: Kinepolis
version: "0.6.5"
slug: kinepolis_bot
description: Scanners voor (nog niet uitgebrachte) films die je de beste plaatsen voorstellen en ze in je mandje zetten.
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:filmstrip
panel_title: Kinepolis
homeassistant_api: true
hassio_api: true
hassio_role: manager
url: https://github.com/Biermienjo/kinepolis-addon
options:
  telegram_token: ""
  telegram_chat_id: ""
  locaties: "kortrijk=KKOR, brussel=KBRU, leuven=SL"
  scan_interval_seconds: 30
  ha_notify_service: ""
  film_paginas: "https://www.kinepolis.be/nl/films/, https://web.kinepolis.be/films"
schema:
  telegram_token: password?
  telegram_chat_id: str?
  locaties: str
  scan_interval_seconds: int(10,3600)
  ha_notify_service: str?
  film_paginas: str
